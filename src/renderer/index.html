<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Barq</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.2 2 4.5 13.4h6.1L9.8 22l8.7-11.4h-6.1L13.2 2Z"/></svg>
      <span data-t="app"></span>
    </div>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" autocomplete="off"></label>
    <div class="titlebar-spacer"></div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <button class="btn-add" id="btn-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="add_link"></span></button>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div class="meter">
          <div class="meter-label" data-t="total_speed"></div>
          <div class="meter-value" id="total-speed">0 KB/s</div>
          <svg class="spark" id="spark" viewBox="0 0 120 28" preserveAspectRatio="none"><path id="spark-path" d=""/></svg>
        </div>
        <button class="limit-chip" id="limit-chip"></button>
        <button class="side-btn" id="btn-settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span data-t="settings"></span></button>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar" id="toolbar"></div>
      <div class="list" id="list" tabindex="0"></div>
      <section class="details" id="details" hidden></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>
  <div id="ctx" class="ctx" hidden></div>
  <div id="drop" class="drop" hidden><div><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span data-t="drop_here"></span></div></div>

  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
