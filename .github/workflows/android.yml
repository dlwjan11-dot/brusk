name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.BARQ_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.BARQ_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/barq.jks"
            echo "BARQ_KS_PATH=$RUNNER_TEMP/barq.jks" >> "$GITHUB_ENV"
            echo "BARQ_KS_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "Release key found"
          else
            echo "No release key yet: building a test APK with the debug key (not published)"
          fi

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect APKs
        if: success()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk out/Barq-Android.apk
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/Barq-Android-32bit.apk
          ls -la out

      - name: Attach to the latest release
        if: success() && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" out/Barq-Android.apk out/Barq-Android-32bit.apk --clobber
          echo "Uploaded to $TAG"

      # The build log goes to the ci-logs branch so it can be read without opening Actions.
      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp android/build.log "$RUNNER_TEMP/logs/android-build.log" 2>/dev/null || echo "no log" > "$RUNNER_TEMP/logs/android-build.log"
          { echo "status=$STATUS"; echo "signed=${SIGNED:-0}"; echo "commit=$GITHUB_SHA"; ls -la out 2>/dev/null; } > "$RUNNER_TEMP/logs/status.txt"
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 android/build.log | head -150 > "$RUNNER_TEMP/logs/errors.txt" || true
          cd "$RUNNER_TEMP/logs"
          git init -q -b ci-logs
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add .
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Android build log ($STATUS)"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
